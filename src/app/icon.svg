<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Trip Planner mark: a sticky note pinned on the timeline. Colours from src/styles/tokens.ts (accent hue 265, note hue 80). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1740cc"/>
      <stop offset="1" stop-color="#0516aa"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#fed081"/>
      <stop offset="1" stop-color="#ecae30"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round">
    <path d="M10 20h6M10 32h6M10 44h6"/>
  </g>
  <g transform="rotate(-7 38 33)">
    <rect x="21" y="17" width="34" height="32" rx="7" fill="url(#note)"/>
    <rect x="21" y="17" width="34" height="32" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
    <path d="M27.5 27h17M27.5 34h11" stroke="#15142a" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <circle cx="40" cy="16" r="4.2" fill="#ff9092" stroke="#ffffff" stroke-width="1.6"/>
</svg>
